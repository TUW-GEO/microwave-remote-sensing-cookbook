version: 1

extends:
  - https://gitlab.tuwien.ac.at/cookbooks/templates/tu-cookbook-config/-/raw/main/tucooks.yml

project:
  title: Microwave Remote Sensing Cookbook
  authors:
    - name: Pikall Nikolas
      affiliations:
        - institution: TU Wien
          department: TU Wien
  source_url: https://gitlab.tuwien.ac.at/cookbooks/private/microwave-remote-sensing-cookbook
  edit_url: https://gitlab.tuwien.ac.at/cookbooks/private/microwave-remote-sensing-cookbook

  keywords:
    - "remote sensing"
    - "microwave"

  parts:
    language: Python
    published: "false"

  open_access: true
  license:
    content: CC-BY-4.0
    code: MIT

  toc:
    - file: README.md
    - title: Preamble
      children:
        - file: notebooks/how-to-cite.md
    - file: notebooks/01_in_class_exercise.ipynb
    - file: notebooks/02_in_class_exercise.ipynb
    - file: notebooks/03_in_class_exercise.ipynb
    - file: notebooks/04_in_class_exercise.ipynb
    - file: notebooks/05_in_class_exercise.ipynb
    - file: notebooks/06_in_class_exercise.ipynb
    - file: notebooks/07_in_class_exercise.ipynb
    # - file: notebooks/08_in_class_exercise.ipynb
    - file: notebooks/09_in_class_exercise.ipynb
    - title: Exercises
      children:
        - file: notebooks/01_homework_exercise.md
        - file: notebooks/02_homework_exercise.md
        - file: notebooks/03_homework_exercise.md
        - file: notebooks/04_homework_exercise.md
        - file: notebooks/05_homework_exercise.md
        - file: notebooks/06_homework_exercise.md
        - file: notebooks/07_homework_exercise.md
        # - file: notebooks/08_homework_exercise.md
        - file: notebooks/09_homework_exercise.md
    - file: CONTRIBUTING.md
  error_rules:
    - rule: image-downloads
      severity: ignore
    - rule: image-format-converts
      severity: ignore
    - rule: link-resolves
      severity: ignore
      keys:
        - https://hub.jaas.datalab.tuwien.ac.at
        - "https://binder.cookbooks.datalab.tuwien.ac.at/**"
