    # - file: notebooks/04_in_class_exercise.ipynb
    - file: notebooks/05_in_class_exercise.ipynb
    - file: notebooks/06_in_class_exercise.ipynb
    - file: notebooks/07_in_class_exercise.ipynb
    - file: notebooks/08_in_class_exercise.ipynb
    - file: notebooks/09_in_class_exercise.ipynb
    - title: Exercises
      children:
        - file: notebooks/01_homework_exercise.md
        - file: notebooks/02_homework_exercise.md
        - file: notebooks/03_homework_exercise.md
        - file: notebooks/04_homework_exercise.md
        - file: notebooks/05_homework_exercise.md
        - file: notebooks/06_homework_exercise.md
        - file: notebooks/07_homework_exercise.md
        - file: notebooks/08_homework_exercise.md
        - file: notebooks/09_homework_exercise.md
