version: 1

extends:
  - https://gitlab.tuwien.ac.at/cookbooks/templates/tu-cookbook-config/-/raw/main/tucooks.yml

project:
  title: Microwave Remote Sensing Cookbook
  description: |
    This cookbook accompanies the TU Wien MSc course "Microwave Remote Sensing
    Exercises". In this course students learn to read, visualize and analyze
    Synthetic Aperture Radar (SAR) data. This will aid interpretation of SAR
    data based upon a physical understanding of sensing principles and the
    interaction of microwaves with natural objects.
  authors:
    - name: Wolfgang Wagner
      affiliations:
        - institution: TU Wien
          department: Research Unit of Remote Sensing
    - name: Martin Schobben
      affiliations:
        - institution: TU Wien
          department: Research Unit of Remote Sensing
    - name: Nikolas Pikall
      affiliations:
        - institution: TU Wien
          department: Research Unit of Remote Sensing
    - name: Joseph Wagner
      affiliations:
        - institution: TU Wien
          department: Research Unit of Remote Sensing
    - name: Davide Festa
      affiliations:
        - institution: TU Wien
          department: Research Unit of Remote Sensing
    - name: Felix David Reuß
      affiliations:
        - institution: TU Wien
          department: Research Unit of Remote Sensing
    - name: Luka Jović
      affiliations:
        - institution: TU Wien
          department: Research Unit of Remote Sensing
  source_url: https://gitlab.tuwien.ac.at/cookbooks/private/microwave-remote-sensing-cookbook
  edit_url: https://gitlab.tuwien.ac.at/cookbooks/private/microwave-remote-sensing-cookbook
  thumbnail: https://gitlab.tuwien.ac.at/cookbooks/data/microwave-remote-sensing-cookbook/-/raw/main/interferrogram.png

  keywords:
    - "remote sensing"
    - "microwave"

  parts:
    language: Python
    published: "false"

  open_access: true
  license:
    content: CC-BY-4.0
    code: MIT

  toc:
