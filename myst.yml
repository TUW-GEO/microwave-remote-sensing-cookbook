      children:
        - file: notebooks/notebook-template.ipynb
    - title: Developing
      children:
        - file: CONTRIBUTING.md
  error_rules:
    - rule: image-downloads
      severity: ignore
    - rule: image-format-converts
      severity: ignore
    - rule: link-resolves
      severity: ignore
      keys:
        - https://hub.jaas.datalab.tuwien.ac.at
        - "https://binder.cookbooks.datalab.tuwien.ac.at/**"
