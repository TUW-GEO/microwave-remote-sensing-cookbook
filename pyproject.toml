[build-system]
requires = ["uv-build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
authors = [
    { name = "npikall", email = "nikolas.pikall@gmail.com" },
]
name = "microwave-remote-sensing-cookbook"
version = "0.0.0"
description = "The cookbook for the Microwave Remote Sensing Course"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Natural Language :: English",
]

[project.optional-dependencies]
book = [
    "jupyter>=1.1.1",
    "jupyter-server>=2.17.0",
    "jupyterlab-myst>=2.6.0",
    "mystmd>=1.8.3",
    "turecipe",
]

[dependency-groups]
dev = [ "pre-commit>=4.5", "ruff>=0.15.11", "ty>=0.0.31" ]

[tool.ruff]
exclude = []
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # missing-trailing-comma (may conflict with ruff formatter)
    "D203",   # incorrect-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.uv.sources]
turecipe = { git = "https://gitlab.tuwien.ac.at/cookbooks/templates/tu-cookbook-ci.git" }
