[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "microwave-remote-sensing-cookbook"
version = "0.0.0"
description = """\
  This cookbook accompanies the TU Wien MSc course \"Microwave Remote Sensing Exercises\". In this course students \
  learn to read, visualize and analyze Synthetic Aperture Radar (SAR) data. This will aid interpretation of SAR data \
  based upon a physical understanding of sensing principles and the interaction of microwaves with natural objects.\
  """
readme = "README.md"
authors = [ { name = "npikall", email = "nikolas.pikall@gmail.com" } ]
requires-python = ">=3.12,<3.14"
classifiers = [
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "aiohttp>=3.13.5",
  "cmcrameri>=1.9",
  "datashader>=0.19",
  "folium>=0.20",
  "holoviews>=1.22.1",
  "hvplot>=0.12.2",
  "intake>=2.0.9",
  "matplotlib>=3.10.9",
  "numpy>=2.4.4",
  "odc>=0.1.3",
  "odc-stac>=0.5.2",
  "pandas>=2.3.3",
  "panel>=1.8.10",
  "pydantic>=2.13.3",
  "pydantic-extra-types>=2.11.1",
  "pystac-client>=0.8.6",
  "python-gitlab>=8.2",
  "rasterio>=1.5",
  "requests>=2.33.1",
  "rich>=15",
  "rioxarray>=0.22",
  "scipy>=1.17.1",
  "seaborn>=0.13.2",
  "shapely>=2.1.2",
  "snaphu>=0.4.1",
  "xarray>=2026.4",
  "zarr<3",
]
optional-dependencies.book = [
  "jupyter>=1.1.1",
  "jupyterlab-myst>=2.7",
  "mystmd>=1.11",
]

[dependency-groups]
dev = [
  "nbmake>=1.5.5",
  "pre-commit>=4.6",
  "pytest-xdist>=3.8",
  "ruff>=0.16.10",
  "tu-cookbook-python",
  "turecipe>=2.0.3",
  "ty>=0.0.85",
]

[tool.uv]
sources.tu-cookbook-python = { git = "https://gitlab.tuwien.ac.at/cookbooks/templates/tu-cookbook-python.git" }
sources.turecipe = { git = "https://gitlab.tuwien.ac.at/cookbooks/templates/tu-cookbook-ci.git" }

[tool.ruff]
target-version = "py313"
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-line-length = "dynamic"
format.docstring-code-format = true
lint.select = [ "B", "E", "F", "I", "SIM", "UP" ]
lint.ignore = [
  "COM812", # missing-trailing-comma (may conflict with ruff formatter)
  "D203",   # incorrect-blank-line-before-class (conflicts with D211)
  "D213",   # multi-line-summary-second-line (conflicts with D212)
  "T201",   # printing
]
lint.fixable = [ "ALL" ]
lint.unfixable = []

[tool.pytest]
ini_options.addopts = "--nbmake -n=auto"
